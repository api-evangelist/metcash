description: Metcash Limited is Australia's leading wholesale distribution and marketing company, with a diversified business
  across food, grocery, hardware and liquor. It supplies and supports independent retailers under banners including IGA, Foodland,
  Campbells, Superior Food, Mitre 10, Home Hardware, Total Tools, Hardings Hardware, Cellarbrations, IGA Liquor and the Bottle-O,
  and operates the MetConnect retailer portal. Metcash is listed on the ASX. It was surfaced via the API Evangelist harvest
  backlog (australia-apidays-2026); no public developer API or documentation was identified on metcash.com.

